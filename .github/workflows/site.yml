name: Check and publish portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check public site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate and validate all languages
        run: |
          python scripts/build_locales.py
          git diff --exit-code -- dist/ar/index.html dist/sv/index.html
          python scripts/check_site.py
          node --check dist/app.js
          node --check dist/preferences.js
      - name: Report checks
        run: echo 'Validated English, Swedish, Arabic, source links and public file allowlist.' >> "$GITHUB_STEP_SUMMARY"

  check-lab:
    name: Check support diagnostics lab
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/support-diagnostics-lab
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Local service and integration tests
        run: python -m unittest discover -s tests -v
      - name: Diagnostic assertions
        run: pwsh -NoProfile -File tests/checks.Tests.ps1
      - name: Report assertions
        run: pwsh -NoProfile -File tests/reports.Tests.ps1

  deploy:
    name: Publish to Cloudflare Pages
    needs: [check, check-lab]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bilalaseel.pages.dev/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare allowlisted public output
        run: |
          python scripts/build_locales.py
          python scripts/check_site.py
      - name: Publish existing Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.142.0'
          command: pages deploy site-build --project-name=bilalaseel --branch=main

